; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
monitor_speed = 115200
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
; The sync firmware exceeds the default OTA slot; use one 3 MiB app partition.
board_build.partitions = cocoseal_partitions.csv

lib_deps = 
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    olikraus/U8g2_for_Adafruit_GFX
    h2zero/NimBLE-Arduino
    bblanchon/ArduinoJson@^7.0.0

upload_speed = 115200
upload_flags = 
    --no-stub

; Set these locally for Wi-Fi testing without committing credentials:
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CONTEST_MODE=1
    -D SERVER_BASE_URL=\"https://coco-seal.mydns.jp\"
    -D SERVER_API_HEX_FIELDS=1
    -D SERVER_SYNC_RUNTIME_ENABLED=1
; Enable only after the Server API accepts the hex fields documented in
; docs/server-sync-api-contract.md:
; change SERVER_API_HEX_FIELDS to 1 above
    -D WIFI_=\"\"
    -D WIFI_PASSWORD=\"\"

[env:esp32-c3-devkitc-02-test]
extends = env:esp32-c3-devkitc-02
build_flags =
    ${env:esp32-c3-devkitc-02.build_flags}
    -D ENABLE_TEST_SEAL_DATA=1
